<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L-System Explorer</title>
<script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --moss: #3d5c3a;
    --panel-bg: #1a2419;
    --border: rgba(122,158,111,0.25);
    --label: #7a9e6f;
    --text: #c8e6c0;
    --accent: #b5c9a8;
    --paper: #faf8f5;
    --ink: #2d3a2c;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--panel-bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ── PANEL ── */
  #panel {
    width: 290px;
    min-width: 290px;
    background: var(--panel-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    overflow-x: hidden;
    padding-bottom: 1.5rem;
  }

  #panel::-webkit-scrollbar { width: 3px; }
  #panel::-webkit-scrollbar-thumb { background: var(--border); }

  .panel-header {
    padding: 20px 20px 14px;
    border-bottom: 1px solid var(--border);
  }

  .panel-header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 400;
    color: var(--accent);
    line-height: 1.2;
  }

  .panel-header h1 em {
    font-style: italic;
    opacity: 0.7;
    font-size: 15px;
    display: block;
    margin-top: 2px;
  }

  .panel-header p {
    font-size: 9px;
    color: var(--label);
    letter-spacing: 0.12em;
    margin-top: 6px;
    opacity: 0.6;
    text-transform: uppercase;
  }

  .section {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
  }

  .section-title {
    font-size: 8px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--label);
    margin-bottom: 10px;
    opacity: 0.8;
  }

  /* ── PRESETS ── */
  .presets {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px;
  }

  .preset-btn {
    background: transparent;
    border: 1px solid rgba(122,158,111,0.2);
    color: var(--label);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    padding: 7px 8px;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s;
    letter-spacing: 0.05em;
    line-height: 1.3;
  }

  .preset-btn:hover {
    border-color: var(--label);
    color: var(--text);
    background: rgba(122,158,111,0.08);
  }

  .preset-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(181,201,168,0.1);
  }

  .preset-btn.placeholder {
    opacity: 0.35;
    cursor: default;
    font-style: italic;
  }

  .preset-btn.placeholder:hover {
    border-color: rgba(122,158,111,0.2);
    color: var(--label);
    background: transparent;
  }

  .preset-tag {
    display: block;
    font-size: 7px;
    opacity: 0.5;
    margin-top: 2px;
    letter-spacing: 0.08em;
  }

  /* ── CONTROLS ── */
  .control {
    margin-bottom: 13px;
  }

  .control:last-child { margin-bottom: 0; }

  .control-label {
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    color: var(--label);
    letter-spacing: 0.08em;
    margin-bottom: 5px;
  }

  .control-label .val {
    color: var(--text);
    font-weight: 400;
  }

  input[type=range] {
    width: 100%;
    height: 2px;
    background: rgba(122,158,111,0.2);
    border: none;
    outline: none;
    -webkit-appearance: none;
    cursor: pointer;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 11px; height: 11px;
    background: var(--label);
    border-radius: 50%;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }

  input[type=range]::-webkit-slider-thumb:hover {
    background: var(--accent);
    transform: scale(1.3);
  }

  /* ── GRAMMAR ── */
  .field-group { margin-bottom: 10px; }
  .field-group:last-child { margin-bottom: 0; }

  .field-label {
    font-size: 8px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--label);
    margin-bottom: 4px;
    opacity: 0.7;
  }

  input[type=text], textarea {
    width: 100%;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(122,158,111,0.2);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    padding: 7px 9px;
    outline: none;
    transition: border-color 0.15s;
    resize: none;
  }

  input[type=text]:focus, textarea:focus {
    border-color: var(--label);
  }

  /* ── BUTTONS ── */
  .btn-row {
    display: flex;
    gap: 6px;
    margin-top: 0;
  }

  .action-btn {
    flex: 1;
    padding: 8px 0;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--label);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
  }

  .action-btn:hover {
    border-color: var(--label);
    color: var(--text);
    background: rgba(122,158,111,0.08);
  }

  .action-btn.mutate:hover {
    border-color: #a3c98a;
    color: #a3c98a;
    background: rgba(100,180,80,0.08);
  }

  .action-btn.animate {
    border-color: rgba(122,158,111,0.4);
  }

  .action-btn.animate:hover, .action-btn.animate.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(181,201,168,0.1);
  }

  .action-btn.animate.active {
    color: var(--accent);
  }

  /* ── READOUT ── */
  .readout {
    margin: 12px 20px 0;
    padding: 10px;
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--border);
    font-size: 8px;
    color: var(--label);
    line-height: 2;
    letter-spacing: 0.05em;
  }

  .readout span { color: var(--text); }

  /* ── CANVAS SIDE ── */
  #sim-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    position: relative;
  }

  #sim-wrap canvas { display: block; }

  .canvas-label {
    position: absolute;
    bottom: 12px;
    right: 14px;
    font-size: 8px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(61,92,58,0.3);
    font-family: 'IBM Plex Mono', monospace;
  }

  .preset-name-overlay {
    position: absolute;
    top: 16px;
    right: 16px;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 13px;
    color: rgba(61,92,58,0.25);
    pointer-events: none;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<div id="panel">
  <div class="panel-header">
    <h1>L-System<em>Explorer</em></h1>
    <p>Lindenmayer · 1968 · string rewriting</p>
  </div>

  <!-- PRESETS -->
  <div class="section">
    <div class="section-title">Presets</div>
    <div class="presets">
      <button class="preset-btn active" data-preset="fern">
        Barnsley Fern
        <span class="preset-tag">classic fern</span>
      </button>
      <button class="preset-btn" data-preset="tree">
        Weirdo Tree
        <span class="preset-tag">2d plant</span>
      </button>
      <button class="preset-btn" data-preset="lsystemtree">
        Binary Tree
        <span class="preset-tag">cyclic angle</span>
      </button>
      <button class="preset-btn placeholder" data-preset="hyphosis" disabled>
        H-yphosis
        <span class="preset-tag">coming soon</span>
      </button>
      <button class="preset-btn placeholder" data-preset="hilbert" disabled>
        Hilbert
        <span class="preset-tag">coming soon</span>
      </button>
    </div>
  </div>

  <!-- STRUCTURE SLIDERS -->
  <div class="section">
    <div class="section-title">Structure</div>

    <div class="control">
      <div class="control-label"><span>Generations</span><span class="val" id="v-gen">4</span></div>
      <input type="range" id="s-gen" min="1" max="8" step="1" value="4">
    </div>

    <div class="control">
      <div class="control-label"><span>Branch angle</span><span class="val" id="v-angle">25°</span></div>
      <input type="range" id="s-angle" min="0" max="360" step="1" value="25">
    </div>

    <div class="control">
      <div class="control-label"><span>Line length</span><span class="val" id="v-len">8</span></div>
      <input type="range" id="s-len" min="2" max="30" step="0.5" value="8">
    </div>

    <div class="control" id="branches-control">
      <div class="control-label"><span>Branch count</span><span class="val" id="v-branches">2</span></div>
      <input type="range" id="s-branches" min="2" max="5" step="1" value="2">
    </div>


  </div>

  <!-- GRAMMAR -->
  <div class="section">
    <div class="section-title">Grammar</div>
    <div class="field-group">
      <div class="field-label">Axiom</div>
      <input type="text" id="axiom" value="A" />
    </div>
    <div class="field-group">
      <div class="field-label">Rules (one per line, e.g. A=AB)</div>
      <textarea id="rules" rows="4">A=AB
B=A</textarea>
    </div>
  </div>

  <!-- ACTIONS -->
  <div class="section">
    <div class="section-title">Actions</div>
    <div class="btn-row">
      <button class="action-btn" id="apply-btn">↻ redraw</button>
      <button class="action-btn mutate" id="mut-btn">⚡ mutate</button>
      <button class="action-btn" id="reset-btn">↺ reset</button>
    </div>
    <div class="btn-row" style="margin-top:6px">
      <button class="action-btn animate" id="anim-btn">▶ animate</button>
    </div>
  </div>

  <!-- INFO READOUT -->
  <div class="readout" id="readout">
    — select a preset to begin —
  </div>
</div>

<!-- CANVAS -->
<div id="sim-wrap">
  <div id="canvas-mount"></div>
  <div class="preset-name-overlay" id="preset-overlay">Barnsley Fern</div>
  <div class="canvas-label">l-system · 2d</div>
</div>

<script>
// ─── PRESETS ────────────────────────────────────────────────────────────────
const PRESETS = {
  fern: {
    name: "Barnsley Fern",
    axiom: "X",
    rules: "X=F+[[X]-X]-F[-FX]+X\nF=FF",
    gen: 5, angle: 25, len: 8, branches: 2,
    startX: 0.5, startY: 0.98, startAngle: -90,
    mode: "tree"
  },
  tree: {
    name: "Tree",
    axiom: "F",
    rules: "F=FF+[+F-F-F]-[-F+F+F]",
    gen: 4, angle: 22, len: 10, branches: 2,
    startX: 0.5, startY: 0.98, startAngle: -90,
    mode: "tree"
  },
  lsystemtree: {
    name: "L-System Tree",
    axiom: "0",
    rules: "",          // built dynamically from branch count
    gen: 5, angle: 35, len: 8, branches: 3,
    startX: 0.5, startY: 0.98, startAngle: -90,
    mode: "lsystemtree"
  }
};

let currentPreset = PRESETS.fern;
let params = {
  gen: 5, angle: 25, len: 8, branches: 2
};

// ─── ANIMATION STATE ────────────────────────────────────────────────────────
let animating = false;
let animAngle = 35;
let animDir = 1;

// ─── L-SYSTEM ENGINE ────────────────────────────────────────────────────────
function parseRules(text) {
  const rules = {};
  text.split('\n').forEach(line => {
    const eq = line.indexOf('=');
    if (eq > 0) {
      rules[line.slice(0, eq).trim()] = line.slice(eq + 1).trim();
    }
  });
  return rules;
}

function generateString(axiom, rules, gen) {
  let str = axiom;
  for (let i = 0; i < gen; i++) {
    let next = '';
    for (const ch of str) {
      next += rules[ch] || ch;
    }
    str = next;
    if (str.length > 80000) break;
  }
  return str;
}

function analyzeString(str) {
  let draws = 0, depth = 0, maxDepth = 0;
  for (const ch of str) {
    if (ch === 'F' || ch === 'G' || ch === '0' || ch === '1') draws++;
    if (ch === '[') { depth++; maxDepth = Math.max(maxDepth, depth); }
    if (ch === ']') depth--;
  }
  return { draws, maxDepth };
}

// ─── p5 SKETCH ──────────────────────────────────────────────────────────────
new p5(function(p) {

  // ── lsystem-tree helpers (from lsystem-tree.html) ──
  function buildLsystemTreeRule(n) {
    let rule = "1";
    for (let i = 0; i < n - 1; i++) rule += "[0]";
    rule += "0";
    return rule;
  }

  function buildLsystemTreeSentence(branches, gen) {
    const rule = buildLsystemTreeRule(branches);
    let s = "0";
    for (let i = 0; i < gen; i++) {
      let next = "";
      for (const ch of s) {
        if      (ch === "1") next += "11";
        else if (ch === "0") next += rule;
        else                 next += ch;
      }
      s = next;
      if (s.length > 80000) break;
    }
    return s;
  }

  function branchAngle(k, n, angle) {
    if (n === 1) return 0;
    const step = (2 * angle) / (n - 1);
    return -angle + (k - 1) * step;
  }

  function drawLsystemTree(s, angleDeg, numBranches, segLen, W, H) {
    p.push();
    p.translate(W / 2, H - 10);
    p.rotate(-p.HALF_PI);
    p.strokeCap(p.ROUND);

    let openCountStack = [0];
    let depth = 0;

    for (const ch of s) {
      if (ch === "0" || ch === "1") {
        const t = Math.min(depth / 8, 1);
        const r = p.lerp(45, 110, t);
        const g = p.lerp(80, 160, t);
        const bv = p.lerp(40, 75, t);
        const sw = Math.max(0.4, 3.0 - t * 2.5);
        p.stroke(r, g, bv, 220 - t * 60);
        p.strokeWeight(sw);
        p.line(0, 0, segLen, 0);
        p.translate(segLen, 0);
      } else if (ch === "[") {
        openCountStack[openCountStack.length - 1]++;
        const idx = openCountStack[openCountStack.length - 1];
        p.push();
        p.rotate(p.radians(branchAngle(idx, numBranches, angleDeg)));
        openCountStack.push(0);
        depth++;
      } else if (ch === "]") {
        openCountStack.pop();
        depth--;
        p.pop();
        const idx = openCountStack[openCountStack.length - 1];
        if (idx === numBranches - 1) {
          p.rotate(p.radians(branchAngle(numBranches, numBranches, angleDeg)));
          openCountStack[openCountStack.length - 1] = 0;
        }
      }
    }
    p.pop();
  }

  function getParams() {
    return {
      axiom:     document.getElementById('axiom').value,
      rulesText: document.getElementById('rules').value,
      gen:       parseInt(document.getElementById('s-gen').value),
      angleDeg:  parseFloat(document.getElementById('s-angle').value),
      len:       parseFloat(document.getElementById('s-len').value),
      branches:  parseInt(document.getElementById('s-branches').value),
    };
  }

  function buildAndDraw(overrideAngle) {
    const pr = currentPreset;
    const pm = getParams();
    const angleDeg = overrideAngle !== undefined ? overrideAngle : pm.angleDeg;

    const W = p.width, H = p.height;
    p.clear();
    p.background(250, 248, 245);

    if (pr.mode === 'lsystemtree') {
      const sentence = buildLsystemTreeSentence(pm.branches, pm.gen);
      const { draws, maxDepth } = analyzeString(sentence);
      document.getElementById('readout').innerHTML =
        `preset: <span>${pr.name}</span><br>` +
        `angle: <span>${Math.round(angleDeg)}°</span><br>` +
        `branches: <span>${pm.branches}</span><br>` +
        `draw calls: <span>${draws.toLocaleString()}</span><br>` +
        `generations: <span>${pm.gen}</span>`;
      drawLsystemTree(sentence, angleDeg, pm.branches, pm.len, W, H);
      return;
    }

    // standard turtle mode
    const rules = parseRules(pm.rulesText);
    const lstr = generateString(pm.axiom, rules, pm.gen);
    const { draws, maxDepth } = analyzeString(lstr);
    document.getElementById('readout').innerHTML =
      `preset: <span>${pr.name}</span><br>` +
      `angle: <span>${Math.round(angleDeg)}°</span><br>` +
      `string len: <span>${lstr.length.toLocaleString()}</span><br>` +
      `draw calls: <span>${draws.toLocaleString()}</span><br>` +
      `max depth: <span>${maxDepth}</span>`;

    drawLSystem(lstr, pm, maxDepth, pr, angleDeg);
  }

  function drawLSystem(lstr, pm, maxDepth, pr, angleDeg) {
    const W = p.width, H = p.height;
    const angleRad = angleDeg * Math.PI / 180;

    let x = pr.startX * W;
    let y = pr.startY * H;
    let angle = (pr.startAngle || -90) * Math.PI / 180;
    const stack = [];
    let depth = 0;
    const md = maxDepth || 1;

    p.strokeCap(p.ROUND);

    for (const ch of lstr) {
      if (ch === 'F' || ch === 'G') {
        const nx = x + pm.len * Math.cos(angle);
        const ny = y + pm.len * Math.sin(angle);
        if (ch === 'F') {
          const t = depth / Math.max(md, 1);
          const r = p.lerp(45, 110, t);
          const g = p.lerp(80, 160, t);
          const bv = p.lerp(40, 75, t);
          const sw = Math.max(0.4, 3.0 - t * 2.5);
          p.stroke(r, g, bv, 220 - t * 60);
          p.strokeWeight(sw);
          p.line(x, y, nx, ny);
        }
        x = nx; y = ny;
      } else if (ch === '+') {
        angle += angleRad;
      } else if (ch === '-') {
        angle -= angleRad;
      } else if (ch === '[') {
        stack.push({ x, y, angle, depth });
        depth++;
      } else if (ch === ']') {
        const s = stack.pop();
        if (s) { x = s.x; y = s.y; angle = s.angle; depth = s.depth; }
      }
    }
  }

  window.rebuildAndDraw = () => buildAndDraw();
  window._p5loop = (on) => { on ? p.loop() : p.noLoop(); };

  p.setup = function() {
    const wrap = document.getElementById('sim-wrap');
    const cnv = p.createCanvas(wrap.clientWidth, wrap.clientHeight);
    cnv.parent('canvas-mount');
    setBranchVisibility(currentPreset.mode);
    p.noLoop();
    buildAndDraw();
  };

  p.draw = function() {
    if (!animating) return;

    // advance angle
    animAngle += animDir * 0.5;
    if (animAngle >= 360) { animAngle = 360; animDir = -1; }
    if (animAngle <= 0)   { animAngle = 0;   animDir =  1; }

    // sync slider + label
    document.getElementById('s-angle').value = animAngle;
    document.getElementById('v-angle').textContent = Math.round(animAngle) + '°';

    buildAndDraw(animAngle);
  };

  p.windowResized = function() {
    const wrap = document.getElementById('sim-wrap');
    p.resizeCanvas(wrap.clientWidth, wrap.clientHeight);
    buildAndDraw();
  };
});

// ─── BRANCH COUNT VISIBILITY ────────────────────────────────────────────────
function setBranchVisibility(mode) {
  document.getElementById('branches-control').style.display =
    mode === 'lsystemtree' ? 'block' : 'none';
}

// ─── LSYSTEM-TREE GRAMMAR SYNC ──────────────────────────────────────────────
function updateLsystemTreeGrammar(branches) {
  let rule = "1";
  for (let i = 0; i < branches - 1; i++) rule += "[0]";
  rule += "0";
  document.getElementById('axiom').value = "0";
  document.getElementById('rules').value = `1=11\n0=${rule}`;
}


const sliders = [
  ['s-gen',      'v-gen',      v => v,                v => v + ''],
  ['s-angle',    'v-angle',    v => parseFloat(v),     v => v + '°'],
  ['s-len',      'v-len',      v => parseFloat(v),     v => v],
  ['s-branches', 'v-branches', v => parseInt(v),       v => v],
];

sliders.forEach(([sid, vid, parse, fmt]) => {
  const el = document.getElementById(sid);
  const lbl = document.getElementById(vid);
  el.addEventListener('input', () => {
    // dragging a slider stops animation
    if (animating) {
      animating = false;
      const animBtn = document.getElementById('anim-btn');
      animBtn.textContent = '▶ animate';
      animBtn.classList.remove('active');
      if (window._p5loop) window._p5loop(false);
    }
    lbl.textContent = fmt(el.value);
    // keep grammar box in sync for lsystemtree
    if (sid === 's-branches' && currentPreset.mode === 'lsystemtree') {
      updateLsystemTreeGrammar(parseInt(el.value));
    }
    if (window.rebuildAndDraw) window.rebuildAndDraw();
  });
});

// ─── PRESET WIRING ──────────────────────────────────────────────────────────
document.querySelectorAll('.preset-btn:not(.placeholder)').forEach(btn => {
  btn.addEventListener('click', () => {
    // stop animation
    animating = false;
    const animBtn = document.getElementById('anim-btn');
    animBtn.textContent = '▶ animate';
    animBtn.classList.remove('active');
    if (window._p5loop) window._p5loop(false);

    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const pr = PRESETS[btn.dataset.preset];
    if (!pr) return;
    currentPreset = pr;

    document.getElementById('axiom').value = pr.axiom;
    document.getElementById('rules').value = pr.rules;
    document.getElementById('s-gen').value = pr.gen;
    document.getElementById('v-gen').textContent = pr.gen;
    document.getElementById('s-angle').value = pr.angle;
    document.getElementById('v-angle').textContent = pr.angle + '°';
    document.getElementById('s-len').value = pr.len;
    document.getElementById('v-len').textContent = pr.len;
    document.getElementById('s-branches').value = pr.branches;
    document.getElementById('v-branches').textContent = pr.branches;
    document.getElementById('preset-overlay').textContent = pr.name;

    if (pr.mode === 'lsystemtree') updateLsystemTreeGrammar(pr.branches);
    setBranchVisibility(pr.mode);

    if (window.rebuildAndDraw) window.rebuildAndDraw();
  });
});

// ─── ACTION BUTTONS ─────────────────────────────────────────────────────────
document.getElementById('apply-btn').addEventListener('click', () => {
  if (window.rebuildAndDraw) window.rebuildAndDraw();
});

document.getElementById('anim-btn').addEventListener('click', () => {
  animating = !animating;
  const btn = document.getElementById('anim-btn');
  if (animating) {
    btn.textContent = '■ stop';
    btn.classList.add('active');
    // seed animAngle from current slider value
    animAngle = parseFloat(document.getElementById('s-angle').value);
    animDir = 1;
    // switch p5 to looping
    if (window._p5loop) window._p5loop(true);
  } else {
    btn.textContent = '▶ animate';
    btn.classList.remove('active');
    if (window._p5loop) window._p5loop(false);
    if (window.rebuildAndDraw) window.rebuildAndDraw();
  }
});

document.getElementById('mut-btn').addEventListener('click', () => {
  const rulesEl = document.getElementById('rules');
  const lines = rulesEl.value.split('\n').filter(l => l.includes('='));
  if (!lines.length) return;

  const symbols = ['F', 'X', 'A', 'B', '+', '-', '[', ']'];
  const idx = Math.floor(Math.random() * lines.length);
  const eq = lines[idx].indexOf('=');
  const lhs = lines[idx].slice(0, eq);
  let rhs = lines[idx].slice(eq + 1);

  const op = Math.floor(Math.random() * 3);
  if (op === 0 && rhs.length > 1) {
    // delete a random char
    const i = Math.floor(Math.random() * rhs.length);
    rhs = rhs.slice(0, i) + rhs.slice(i + 1);
  } else if (op === 1) {
    // insert a random symbol
    const i = Math.floor(Math.random() * rhs.length);
    const sym = symbols[Math.floor(Math.random() * symbols.length)];
    rhs = rhs.slice(0, i) + sym + rhs.slice(i);
  } else {
    // swap two chars
    if (rhs.length > 1) {
      const i = Math.floor(Math.random() * rhs.length);
      const sym = symbols[Math.floor(Math.random() * symbols.length)];
      rhs = rhs.slice(0, i) + sym + rhs.slice(i + 1);
    }
  }
  lines[idx] = `${lhs}=${rhs}`;
  rulesEl.value = lines.join('\n');
  if (window.rebuildAndDraw) window.rebuildAndDraw();
});

document.getElementById('reset-btn').addEventListener('click', () => {
  // stop animation
  animating = false;
  const animBtn = document.getElementById('anim-btn');
  animBtn.textContent = '▶ animate';
  animBtn.classList.remove('active');
  if (window._p5loop) window._p5loop(false);

  const pr = currentPreset;
  document.getElementById('axiom').value = pr.axiom;
  document.getElementById('rules').value = pr.rules;
  document.getElementById('s-gen').value = pr.gen;
  document.getElementById('v-gen').textContent = pr.gen;
  document.getElementById('s-angle').value = pr.angle;
  document.getElementById('v-angle').textContent = pr.angle + '°';
  document.getElementById('s-len').value = pr.len;
  document.getElementById('v-len').textContent = pr.len;
  if (window.rebuildAndDraw) window.rebuildAndDraw();
});
</script>
