<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art — Jagrut Amuri</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400;1,600&family=Fragment+Mono:ital@0;1&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1a1520;
            --paper: #f0e8d8;
            --card-bg: #efe6d4;
            --dark-bg: #0f0d18;
            --indigo: #1e1a36;
            --indigo-mid: #2d2652;
            --gold: #c9903a;
            --gold-pale: #e8c97a;
            --terra: #a63d2f;
            --terra-light: #c4664a;
            --ash: #8c7fa0;
            --mist: #c4b8d8;
            --crimson: #7a1f1f;
            --mono: 'Space Mono', monospace;
            --serif: 'Lora', serif;
            --frag: 'Fragment Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(ellipse 80% 60% at 20% 60%, rgba(72, 22, 98, 0.28) 0%, transparent 65%),
                radial-gradient(ellipse 50% 40% at 75% 85%, rgba(55, 15, 80, 0.18) 0%, transparent 60%);
            color: var(--mist);
            font-family: var(--serif);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Grain */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.07'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 999;
            opacity: 0.5;
        }

        /* ── BACKGROUND ART ── */
        .bg-art {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .page {
            position: relative;
            z-index: 1;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* ── HEADER ── */
        header {
            padding: 4rem 0 2rem;
            border-bottom: 1px solid rgba(196,184,216,0.2);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .back { font-family: var(--frag); font-size: 0.72rem; color: var(--ash); text-decoration: none; letter-spacing: 0.1em; text-transform: uppercase; transition: color 0.2s; }
        .back:hover { color: var(--mist); }

        .page-title { font-family: var(--mono); font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 700; color: var(--gold-pale); letter-spacing: -0.03em; line-height: 0.9; }
        .page-sub { font-family: var(--frag); font-size: 0.7rem; color: var(--ash); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 0.4rem; }

        /* ── FILTERS ── */
        .filter-bar { display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 2rem 0 1rem; }
        .filter-btn { font-family: var(--frag); font-size: 0.68rem; padding: 0.3rem 0.8rem; border: 1px solid rgba(196,184,216,0.25); color: var(--ash); letter-spacing: 0.08em; text-transform: lowercase; border-radius: 2px; background: transparent; cursor: pointer; transition: all 0.2s; }
        .filter-btn:hover, .filter-btn.active { background: rgba(45,38,82,0.7); color: var(--gold-pale); border-color: var(--gold); }

        /* ── SECTION MARKER ── */
        .section-marker { display: flex; align-items: center; gap: 1rem; margin-bottom: 0; }
        .section-marker span { font-family: var(--frag); font-size: 0.72rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--ash); }
        .section-marker::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(196,184,216,0.25), transparent); }

        /* ── GALLERY ── */
        .gallery {
            columns: 3;
            column-gap: 1.4rem;
            padding: 1.5rem 0 6rem;
        }
        @media (max-width: 640px) { .gallery { columns: 1; } }

        /* ── CARD ── */
        .art-card {
            break-inside: avoid;
            margin-bottom: 1.4rem;
            cursor: pointer;
            position: relative;
            animation: popIn 0.4s ease both;
        }
        .art-card:nth-child(odd) { animation-delay: 0.05s; }
        .art-card:nth-child(even) { animation-delay: 0.12s; }

        @keyframes popIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        /* Tape */
        .art-card::before {
            content: '';
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%) rotate(-1.5deg);
            width: 48px;
            height: 18px;
            background: rgba(201,144,58,0.25);
            border: 1px solid rgba(201,144,58,0.35);
            z-index: 2;
            border-radius: 1px;
            pointer-events: none;
        }
        .art-card:nth-child(even)::before { transform: translateX(-60%) rotate(2deg); background: rgba(140,127,160,0.2); border-color: rgba(140,127,160,0.3); }
        .art-card:nth-child(3n)::before { transform: translateX(-40%) rotate(-0.8deg); }

        .card-inner {
            background: var(--card-bg);
            padding: 0.7rem 0.7rem 0;
            box-shadow: 0 4px 24px rgba(0,0,0,0.6), 0 1px 4px rgba(0,0,0,0.4);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            overflow: hidden;
        }

        .art-card.expanded .card-inner {
            transform: rotate(0deg) !important;
            box-shadow: 0 8px 40px rgba(0,0,0,0.7), 0 0 60px rgba(122,31,31,0.12);
        }

        .art-card:not(.expanded):hover .card-inner {
            transform: rotate(0deg) translateY(-3px) !important;
            box-shadow: 0 8px 32px rgba(0,0,0,0.65), 0 0 30px rgba(201,144,58,0.06);
        }

        .card-img {
            width: 100%;
            display: block;
            object-fit: cover;
            transition: opacity 0.2s;
        }

        /* ── COLLAPSED ANNOTATION ── */
        .annotation {
            padding: 0.7rem 0.4rem 0.8rem;
        }

        .annotation-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.5rem;
        }

        .annotation-title { font-family: var(--serif); font-size: 0.95rem; font-weight: 600; font-style: italic; color: var(--ink); line-height: 1.3; }
        .annotation-medium { font-family: var(--frag); font-size: 0.6rem; color: var(--terra); letter-spacing: 0.06em; margin-top: 0.25rem; }

        .expand-hint {
            font-family: var(--frag);
            font-size: 0.62rem;
            color: var(--ash);
            letter-spacing: 0.05em;
            flex-shrink: 0;
            margin-top: 0.1rem;
            transition: color 0.2s;
            user-select: none;
        }

        .art-card.expanded .expand-hint { color: var(--terra); }

        .annotation-tags { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-top: 0.5rem; }
        .tag { font-family: var(--frag); font-size: 0.58rem; padding: 0.12rem 0.4rem; border: 1px solid rgba(140,127,160,0.4); color: var(--indigo-mid); letter-spacing: 0.06em; border-radius: 2px; background: rgba(45,38,82,0.07); }
        .tag.series-tag { border-color: rgba(201,144,58,0.5); color: var(--gold); background: rgba(201,144,58,0.06); }

        .dashed-rule { margin-top: 0.7rem; height: 1px; background: repeating-linear-gradient(90deg, rgba(140,127,160,0.3) 0, rgba(140,127,160,0.3) 4px, transparent 4px, transparent 8px); opacity: 0.6; }

        /* ── EXPANDED PANEL ── */
        .expanded-panel {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.45s cubic-bezier(0.4, 0, 0.2, 1);
            background: var(--card-bg);
        }

        .art-card.expanded .expanded-panel {
            max-height: 600px;
        }

        .expanded-inner {
            padding: 0 0.4rem 1rem;
            border-top: 1px solid rgba(140,127,160,0.15);
        }

        .expanded-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.3rem 1rem;
            margin-top: 0.9rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px dashed rgba(140,127,160,0.2);
        }

        .meta-item {}
        .meta-label { font-family: var(--frag); font-size: 0.58rem; color: var(--ash); letter-spacing: 0.1em; text-transform: uppercase; }
        .meta-value { font-family: var(--serif); font-size: 0.82rem; color: var(--ink); margin-top: 0.1rem; }

        .expanded-section { margin-top: 0.9rem; }
        .expanded-section-label {
            font-family: var(--frag);
            font-size: 0.6rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--terra);
            margin-bottom: 0.35rem;
        }

        .expanded-text {
            font-family: var(--serif);
            font-size: 0.82rem;
            line-height: 1.7;
            color: #4a3f5c;
            font-style: italic;
        }

        .series-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            font-family: var(--frag);
            font-size: 0.58rem;
            color: var(--gold);
            letter-spacing: 0.08em;
            border: 1px solid rgba(201,144,58,0.3);
            padding: 0.15rem 0.5rem;
            border-radius: 2px;
            margin-top: 0.5rem;
            background: rgba(201,144,58,0.05);
        }

        .corner-date { position: absolute; bottom: 1rem; right: 0.8rem; font-family: var(--frag); font-size: 0.56rem; color: var(--ash); letter-spacing: 0.06em; z-index: 2; opacity: 0.7; }

        /* ── LIGHTBOX ── */
        .lightbox { position: fixed; inset: 0; background: rgba(5,4,12,0.97); z-index: 1000; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .lightbox.open { opacity: 1; pointer-events: all; }
        .lightbox-inner { max-width: 85vw; max-height: 88vh; position: relative; }
        .lightbox-inner img { max-width: 100%; max-height: 88vh; object-fit: contain; display: block; }
        .lightbox-close { position: absolute; top: -2.2rem; right: 0; font-family: var(--frag); font-size: 0.68rem; color: var(--ash); cursor: pointer; letter-spacing: 0.1em; text-transform: uppercase; }
        .lightbox-close:hover { color: var(--gold-pale); }
        .view-full {
            display: block;
            text-align: center;
            font-family: var(--frag);
            font-size: 0.6rem;
            color: var(--ash);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 0.5rem 0 0;
            cursor: pointer;
            transition: color 0.2s;
            border: none;
            background: none;
            width: 100%;
        }
        .view-full:hover { color: var(--terra); }
    </style>
</head>

    </div>
</div>

<script>
// ─────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────
function renderGallery(filter = 'all') {
    const artworks = window.artworks;
    const gallery = document.getElementById('gallery');
    const filtered = filter === 'all' ? artworks : artworks.filter(a => a.filter.includes(filter));

    gallery.innerHTML = filtered.map((a, i) => `
        <div class="art-card" data-index="${i}" style="animation-delay:${i * 0.06}s">
            <div class="card-inner">

                <img class="card-img" src="${a.image}" alt="${a.title}" loading="lazy"
                     onerror="this.style.opacity=0.1;this.style.minHeight='140px'">

                <div class="annotation">
                    <div class="annotation-header">
                        <div>
                            <div class="annotation-title">${a.title}</div>
                            <div class="annotation-medium">${a.medium} · ${a.year}</div>
                            ${a.series ? `<div class="series-badge">series: ${a.series}</div>` : ''}
                        </div>
                        <div class="expand-hint">[ + ]</div>
                    </div>
                    <div class="annotation-tags">
                        ${a.tags.map(t => `<span class="tag">${t}</span>`).join('')}
                        ${a.series ? `<span class="tag series-tag">${a.series}</span>` : ''}
                    </div>
                    <div class="dashed-rule"></div>
                </div>

                <!-- EXPANDED PANEL -->
                <div class="expanded-panel">
                    <div class="expanded-inner">
                        <div class="expanded-row">
                            <div class="meta-item">
                                <div class="meta-label">dimensions</div>
                                <div class="meta-value">${a.dimensions}</div>
                            </div>
                            <div class="meta-item">
                                <div class="meta-label">medium</div>
                                <div class="meta-value">${a.medium}</div>
                            </div>
                            <div class="meta-item">
                                <div class="meta-label">year</div>
                                <div class="meta-value">${a.year}</div>
                            </div>
                            ${a.series ? `<div class="meta-item"><div class="meta-label">series</div><div class="meta-value">${a.series}</div></div>` : ''}
                        </div>

                        <div class="expanded-section">
                            <div class="expanded-section-label">process</div>
                            <div class="expanded-text">${a.process}</div>
                        </div>

                        <div class="expanded-section">
                            <div class="expanded-section-label">inspiration</div>
                            <div class="expanded-text">${a.inspiration}</div>
                        </div>

                        <div class="expanded-section">
                            <div class="expanded-section-label">what it means</div>
                            <div class="expanded-text">${a.meaning}</div>
                        </div>

                        <button class="view-full" data-img="${a.image}">view full image ↗</button>
                    </div>
                </div>

            </div>
            <div class="corner-date">${a.year}</div>
        </div>
    `).join('');

    // Card expand/collapse
    gallery.querySelectorAll('.art-card').forEach(card => {
        const inner = card.querySelector('.card-inner');
        const hint = card.querySelector('.expand-hint');

        inner.addEventListener('click', (e) => {
            // Don't expand if clicking view-full button
            if (e.target.matches('.view-full')) return;

            const isExpanded = card.classList.contains('expanded');

            // Collapse all others
            gallery.querySelectorAll('.art-card.expanded').forEach(c => {
                c.classList.remove('expanded');
                c.querySelector('.expand-hint').textContent = '[ + ]';
            });

            if (!isExpanded) {
                card.classList.add('expanded');
                hint.textContent = '[ − ]';
                // Scroll card into view gently
                setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
            }
        });
    });

    // View full image (lightbox)
    gallery.querySelectorAll('.view-full').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            document.getElementById('lb-img').src = btn.dataset.img;
            document.getElementById('lightbox').classList.add('open');
        });
    });
}

// Filters
document.getElementById('filters').addEventListener('click', e => {
    if (!e.target.matches('.filter-btn')) return;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    renderGallery(e.target.dataset.filter);
});

// Lightbox
document.getElementById('lb-close').addEventListener('click', () => document.getElementById('lightbox').classList.remove('open'));
document.getElementById('lightbox').addEventListener('click', e => {
    if (e.target === document.getElementById('lightbox')) document.getElementById('lightbox').classList.remove('open');
});

// ─────────────────────────────────────────────
// LOAD DATA from artworks.json
// ─────────────────────────────────────────────
fetch('artworks.json')
    .then(res => res.json())
    .then(data => {
        window.artworks = data;
        renderGallery();
    })
    .catch(err => {
        console.error('Could not load artworks.json:', err);
        document.getElementById('gallery').innerHTML = '<p style="color:var(--lichen);font-family:var(--frag);font-size:0.8rem;padding:2rem 0;">could not load artworks — make sure artworks.json is in the same folder and you\'re running a local server.</p>';
    });
</script>
</body>
</html>
